# Sklubot sur un VPS seul : l'application, l'image des ordinateurs des bots, et Caddy pour le HTTPS automatique.
# Lancé par deploy/install.sh ; les valeurs viennent du fichier .env à côté.
#
# Sécurité :
#  - l'application n'a pas le socket Docker : elle passe par « docker-proxy », qui n'ouvre que la partie de l'API
#    Docker dont elle a besoin (conteneurs, exec, volumes, images, réseaux) ; ce proxy est sur un réseau interne
#    où les ordinateurs des bots n'ont pas accès ;
#  - l'application tourne sans aucun privilège Linux (cap_drop ALL), sur un système de fichiers en lecture seule :
#    même un bug ne pourrait pas réécrire son propre code ; seules /data et /tmp sont modifiables.
#  Pourquoi pas un utilisateur non-root : les ordinateurs des bots (root chez eux) écrivent dans la même
#  bibliothèque (/data) des fichiers appartenant à root ; un utilisateur non-root ne pourrait plus les gérer sans
#  reprendre les privilèges qu'on vient de retirer. Être root sans aucune capacité ni écriture hors de /data
#  donne la même protection, sans casser les fichiers des bots.
services:
  sklubot:
    build:
      context: .
      dockerfile: Dockerfile.production
    image: sklubot-server
    restart: unless-stopped
    depends_on:
      desktop-image:
        condition: service_completed_successfully
      docker-proxy:
        condition: service_started
    environment:
      PORT: "3000"
      PUBLIC_URL: "${SKLUBOT_PUBLIC_URL}"
      SESSION_SECRET: "${SKLUBOT_SESSION_SECRET}"
      # Code à donner pour créer le premier compte (affiché à la fin de l'installation). Inutile ensuite.
      SETUP_CODE: "${SKLUBOT_SETUP_CODE:-}"
      # Derrière Caddy : l'adresse du visiteur est la dernière entrée de X-Forwarded-For (limite des tentatives de connexion).
      TRUST_PROXY: "1"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      XAI_API_KEY: "${XAI_API_KEY:-}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      DEFAULT_MODEL: "${SKLUBOT_DEFAULT_MODEL:-}"
      DEMO_MODE: "${SKLUBOT_DEMO_MODE:-0}"
      FALLBACK_MODEL: "${SKLUBOT_FALLBACK_MODEL:-}"
      BRAVE_API_KEY: "${BRAVE_API_KEY:-}"
      SEARXNG_URL: "${SEARXNG_URL:-}"
      OPEN_SIGNUP: "${SKLUBOT_OPEN_SIGNUP:-0}"
      ALLOWED_EMAILS: "${SKLUBOT_ALLOWED_EMAILS:-}"
      # Mode hébergé commercial (offres, abonnements, budget IA par compte, page d'administration) : 1 pour l'activer.
      # Voir docs/MODE-HEBERGE.md. À 0 (par défaut), Sklubot se comporte exactement comme une installation personnelle.
      HOSTED_MODE: "${SKLUBOT_HOSTED_MODE:-0}"
      # Ouverture publique (docs/OUVERTURE-PUBLIQUE.md), tout vide = valeurs par défaut. Turnstile : clés du tableau de bord
      # Cloudflare (la clé secrète ne quitte jamais le serveur). Limites d'inscription par quart d'heure : par adresse IP, et en tout.
      TURNSTILE_SITE_KEY: "${SKLUBOT_TURNSTILE_SITE_KEY:-}"
      TURNSTILE_SECRET_KEY: "${SKLUBOT_TURNSTILE_SECRET_KEY:-}"
      SIGNUP_PER_IP: "${SKLUBOT_SIGNUP_PER_IP:-}"
      SIGNUP_GLOBAL: "${SKLUBOT_SIGNUP_GLOBAL:-}"
      DISPOSABLE_EMAIL_BLOCK: "${SKLUBOT_DISPOSABLE_EMAIL_BLOCK:-}"
      EMAIL_VERIFICATION: "${SKLUBOT_EMAIL_VERIFICATION:-}"
      # Comptes jamais confirmés : supprimés automatiquement après ce nombre d'heures (défaut 5).
      UNVERIFIED_ACCOUNT_TTL_HOURS: "${SKLUBOT_UNVERIFIED_ACCOUNT_TTL_HOURS:-}"
      # Offre Gratuite (mode hébergé) : ordinateurs jetables partagés (pool), « personal » (comme avant) ; combien à la fois.
      FREE_PLAN_COMPUTER: "${SKLUBOT_FREE_PLAN_COMPUTER:-}"
      FREE_COMPUTERS_MAX: "${SKLUBOT_FREE_COMPUTERS_MAX:-}"
      FREE_COMPUTER_IDLE_MIN: "${SKLUBOT_FREE_COMPUTER_IDLE_MIN:-}"
      FREE_COMPUTER_MEMORY: "${SKLUBOT_FREE_COMPUTER_MEMORY:-}"
      FREE_COMPUTER_CPUS: "${SKLUBOT_FREE_COMPUTER_CPUS:-}"
      # « Continuer avec Google » : identifiants OAuth (console Google Cloud), ou à saisir dans Réglages → Compte.
      GOOGLE_LOGIN_CLIENT_ID: "${SKLUBOT_GOOGLE_LOGIN_CLIENT_ID:-}"
      GOOGLE_LOGIN_CLIENT_SECRET: "${SKLUBOT_GOOGLE_LOGIN_CLIENT_SECRET:-}"
      COMPUTER: "linux"
      DATA_VOLUME: "sklubot_data"
      # Les ordinateurs des bots sont sur leur propre réseau (BOTS_NETWORK, créé par Sklubot, sans trafic entre eux) et
      # joignent Sklubot par une prise (socket) qui leur est propre, servie à part : ils n'atteignent ni ses ports, ni le
      # récepteur de courrier, ni le proxy Docker, ni la voix, ni les autres ordinateurs (revue de sécurité H2).
      BOT_LINK: "${SKLUBOT_BOT_LINK:-socket}"
      BOTS_NETWORK: "sklubot_bots"
      # Utilisés seulement avec SKLUBOT_BOT_LINK=network (l'ancienne façon, sur le réseau de Sklubot).
      DESKTOP_NETWORK: "sklubot_net"
      ENGINE_BASE_URL: "http://sklubot:3000"
      MAX_DESKTOPS: "${SKLUBOT_MAX_DESKTOPS:-4}"
      # Durée max d'un tour Claude Code / Codex, en minutes (0 = sans limite).
      ENGINE_TURN_TIMEOUT_MINUTES: "${SKLUBOT_ENGINE_TURN_TIMEOUT_MINUTES:-60}"
      # bot_message avec attente : attente par défaut et maximale de la réponse d'un autre bot (secondes) ; disque d'un
      # ordinateur de bot rempli à ce pourcentage : carte « disque plein ».
      BOT_WAIT_DEFAULT_SECONDS: "${SKLUBOT_BOT_WAIT_DEFAULT_SECONDS:-180}"
      BOT_WAIT_MAX_SECONDS: "${SKLUBOT_BOT_WAIT_MAX_SECONDS:-600}"
      DISK_ALERT_PERCENT: "${SKLUBOT_DISK_ALERT_PERCENT:-90}"
      # Nombre de bots au plus sur toute l'installation (0 = sans limite) ; nom et rôle du premier bot de chaque compte.
      MAX_BOTS: "${SKLUBOT_MAX_BOTS:-0}"
      FIRST_BOT_NAME: "${SKLUBOT_FIRST_BOT_NAME:-}"
      FIRST_BOT_LABEL: "${SKLUBOT_FIRST_BOT_LABEL:-}"
      DESKTOP_MEMORY: "${SKLUBOT_DESKTOP_MEMORY:-2g}"
      # Facultatif : taille maximale du disque propre de chaque ordinateur (ex. 20G), seulement là où Docker sait la
      # limiter (overlay2 sur xfs avec pquota, btrfs, zfs) ; ailleurs, ignoré. Vide = pas de limite.
      DESKTOP_DISK_QUOTA: "${SKLUBOT_DESKTOP_DISK_QUOTA:-}"
      # Facultatif : environnement d'exécution des ordinateurs (ex. runsc pour gVisor, à installer sur l'hôte).
      DESKTOP_RUNTIME: "${SKLUBOT_DESKTOP_RUNTIME:-}"
      # Sous cet espace libre (Mo) sur le disque des données, l'ordinateur inactif qui a le plus écrit est mis en veille.
      DISK_FREE_MIN_MB: "${SKLUBOT_DISK_FREE_MIN_MB:-2048}"
      # Ordinateurs partagés entre les bots d'un compte : au plus ce nombre par compte.
      MAX_SHARED_COMPUTERS: "${SKLUBOT_MAX_SHARED_COMPUTERS:-3}"
      DESKTOP_CPUS: "${SKLUBOT_DESKTOP_CPUS:-2}"
      # Clavier des ordinateurs des bots (nom de disposition X : us, fr, de…).
      DESKTOP_KEYBOARD: "${SKLUBOT_DESKTOP_KEYBOARD:-us}"
      # Docker, à travers le proxy filtrant (voir plus bas), jamais le socket lui-même.
      DOCKER_HOST: "tcp://docker-proxy:2375"
      # Vague 6 — voix serveur (profil « voice » ci-dessous) : whisper.cpp + Piper sur le réseau interne. Vides = appels par le navigateur.
      VOICE_STT_URL: "${SKLUBOT_VOICE_STT_URL:-}"
      VOICE_TTS_URL: "${SKLUBOT_VOICE_TTS_URL:-}"
      # Kokoro (profil « kokoro » ci-dessous), voix gratuites auto-hébergées, une par bot possible : http://kokoro:8880. Vide = pas de Kokoro.
      VOICE_KOKORO_URL: "${SKLUBOT_VOICE_KOKORO_URL:-}"
      # Vague 6 — adresse e-mail propre aux bots : domaine dont le MX pointe vers ce serveur. Le récepteur écoute sur 2525
      # dans le conteneur (pas de privilège pour le port 25) ; publier le port 25 : docker-compose.mail.yml.
      MAIL_DOMAIN: "${SKLUBOT_MAIL_DOMAIN:-}"
      MAIL_SMTP_PORT: "${SKLUBOT_MAIL_SMTP_PORT:-0}"
      MAIL_HOSTNAME: "${SKLUBOT_MAIL_HOSTNAME:-}"
      # E-mails du serveur (mot de passe oublié, changement d'adresse). Facultatif : sinon, réglables dans
      # Réglages → Compte par le propriétaire. Ces variables l'emportent. SMTP_TLS : tls (port 465), starttls (587) ou none.
      SMTP_HOST: "${SKLUBOT_SMTP_HOST:-}"
      SMTP_PORT: "${SKLUBOT_SMTP_PORT:-}"
      SMTP_TLS: "${SKLUBOT_SMTP_TLS:-}"
      SMTP_USER: "${SKLUBOT_SMTP_USER:-}"
      SMTP_PASS: "${SKLUBOT_SMTP_PASS:-}"
      SMTP_FROM: "${SKLUBOT_SMTP_FROM:-}"
      # Places des espaces d'équipe (par défaut, et maximum qu'un propriétaire peut choisir).
      WORKSPACE_SEATS: "${SKLUBOT_WORKSPACE_SEATS:-10}"
      WORKSPACE_MAX_SEATS: "${SKLUBOT_WORKSPACE_MAX_SEATS:-50}"
    volumes:
      - sklubot_data:/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - "no-new-privileges:true"
    networks:
      - default
      - docker
      - voice
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:3000/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # Le seul à voir le socket Docker : le proxy de Sklubot (server/src/dockerproxy.ts, même image que l'application,
  # lancé seul, sans données ni secret ni privilège). Il lit le contenu des demandes, pas seulement leurs adresses :
  # un conteneur n'est créé que depuis l'image des ordinateurs, sans privilège, avec les capacités réduites, sur le
  # réseau des bots, sans dossier de l'hôte ni espace de noms de l'hôte ; les autres actions ne touchent que les
  # conteneurs portant l'étiquette de Sklubot ; tout le reste répond 403 (revue de sécurité H3). Cela reste un accès
  # à Docker : il ne doit jamais être joignable par autre chose que l'application (réseau interne « docker »).
  # Sur un système à SELinux (Fedora, RHEL), ajoute « security_opt: [label:disable] » à ce service si Sklubot ne joint pas Docker.
  docker-proxy:
    build:
      context: .
      dockerfile: Dockerfile.production
    command: ["node", "server/dist/dockerproxy.js"]
    restart: unless-stopped
    environment:
      DESKTOP_IMAGE: "sklubot-desktop"
      # Réseaux où un ordinateur peut être créé. Avec SKLUBOT_BOT_LINK=network (l'ancienne façon), mets
      # SKLUBOT_PROXY_NETWORKS=sklubot_bots,sklubot_net.
      PROXY_NETWORKS: "${SKLUBOT_PROXY_NETWORKS:-sklubot_bots}"
      PROXY_DATA_VOLUME: "sklubot_data"
      PROXY_RUNTIMES: "${SKLUBOT_DESKTOP_RUNTIME:-}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - "no-new-privileges:true"
    networks:
      - docker

  desktop-image:
    build:
      context: docker/desktop
    image: sklubot-desktop
    command: ["true"]
    restart: "no"

  # ── Vague 6 : voix serveur auto-hébergée, gratuite (facultative) ──
  # docker compose --profile voice up -d  puis  SKLUBOT_VOICE_STT_URL=http://whisper:8080 et SKLUBOT_VOICE_TTS_URL=http://piper:5000
  # whisper.cpp : image officielle épinglée par empreinte (ghcr.io/ggml-org/whisper.cpp, README « Docker ») ; le modèle est
  # téléchargé une fois dans le volume. Point d'entrée de l'image : bash -c, d'où une seule chaîne de commande.
  whisper:
    image: "${WHISPER_IMAGE:-ghcr.io/ggml-org/whisper.cpp:main@sha256:203ed2a39087406689e78ea5a664fef7ae596ee548f3323a4ffc63169da84933}"
    profiles: ["voice"]
    restart: unless-stopped
    command: ["[ -f /models/ggml-${WHISPER_MODEL:-base}.bin ] || ./models/download-ggml-model.sh ${WHISPER_MODEL:-base} /models; whisper-server --host 0.0.0.0 --port 8080 -m /models/ggml-${WHISPER_MODEL:-base}.bin -l auto"]
    volumes:
      - whisper_models:/models
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
  # Piper : pas d'image officielle du serveur HTTP ; construite ici (docker/piper, version de piper-tts épinglée).
  piper:
    build:
      context: docker/piper
    image: sklubot-piper
    profiles: ["voice"]
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  # ── Kokoro : synthèse vocale gratuite auto-hébergée, des dizaines de voix, une voix par bot (facultatif) ──
  # Kokoro-FastAPI (https://github.com/remsky/Kokoro-FastAPI, Apache-2.0), modèle Kokoro-82M (Apache-2.0,
  # https://huggingface.co/hexgrad/Kokoro-82M), image CPU officielle épinglée, modèles inclus dans l'image.
  # Activer : docker compose --profile kokoro up -d  puis  SKLUBOT_VOICE_KOKORO_URL=http://kokoro:8880 (et redémarrer Sklubot).
  # Mémoire : environ 1 à 2 Go de RAM en marche (modèle de 82 M paramètres + PyTorch CPU) — plafonnée par KOKORO_MEM_LIMIT.
  # Réseau : seulement « voice » (interne, sans Internet), que seule l'application rejoint — ni publié, ni joignable
  # par les ordinateurs des bots.
  kokoro:
    image: "${KOKORO_IMAGE:-ghcr.io/remsky/kokoro-fastapi-cpu:v0.10.0}"
    profiles: ["kokoro"]
    restart: unless-stopped
    mem_limit: "${KOKORO_MEM_LIMIT:-3g}"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks:
      - voice

  # Reçoit le trafic web. Avec un nom de domaine, obtient et renouvelle seul le certificat HTTPS.
  caddy:
    image: "${CADDY_IMAGE:-caddy:2}"
    restart: unless-stopped
    depends_on:
      - sklubot
    ports:
      - "${SKLUBOT_HTTP_PORT:-80}:80"
      - "${SKLUBOT_HTTPS_PORT:-443}:443"
    environment:
      SITE_ADDRESS: "${SKLUBOT_SITE_ADDRESS:-:80}"
    # deploy/Caddyfile : relaie tout vers Sklubot, sauf /mcp/ (réservé aux ordinateurs des bots, sur le réseau interne).
    command: ["caddy", "run", "--config", "/etc/caddy/Caddyfile", "--adapter", "caddyfile"]
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

networks:
  default:
    name: sklubot_net
  # Réseau interne entre l'application et le proxy Docker : pas d'accès Internet, et les ordinateurs des bots
  # (sur sklubot_net) n'y sont pas.
  docker:
    name: sklubot_docker
    internal: true
  # Interne : l'application et Kokoro seulement (pas les ordinateurs des bots, pas Internet).
  voice:
    name: sklubot_voice
    internal: true

volumes:
  sklubot_data:
    name: sklubot_data
  caddy_data:
  caddy_config:
  whisper_models:
