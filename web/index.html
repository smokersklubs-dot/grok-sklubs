<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <title>Sklubot</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect x='6' y='6' width='88' height='88' rx='28' fill='%23e2552d'/%3E%3Ctext x='50' y='52' text-anchor='middle' dominant-baseline='central' font-family='system-ui,sans-serif' font-size='52' font-weight='700' fill='white'%3ES%3C/text%3E%3C/svg%3E" />
    <script>
      (function () {
        var theme = "system";
        try {
          var raw = localStorage.getItem("sklubot.prefs");
          if (raw) theme = JSON.parse(raw).theme || "system";
        } catch (e) {}
        var dark = theme === "dark" || (theme !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
