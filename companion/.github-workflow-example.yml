# Example GitHub Actions workflow for Sklubot Relais (companion/).
# Not active: copy it to .github/workflows/relais.yml if you want it.
# Builds the three desktop apps on native runners (electron-builder recommends building each OS on
# its own runner: https://www.electron.build/docs/features/github-actions).
#
# Optional secrets (without them the builds are produced UNSIGNED):
#   macOS  : CSC_LINK (base64 .p12 "Developer ID Application"), CSC_KEY_PASSWORD,
#            and for notarisation APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID
#            (or APPLE_API_KEY, APPLE_API_KEY_ID, APPLE_API_ISSUER) — https://www.electron.build/docs/notarization
#   Windows: WIN_CSC_LINK (base64 .pfx), WIN_CSC_KEY_PASSWORD
name: Sklubot Relais

on:
  push:
    tags: ['relais-v*']
    paths: ['companion/**']
  workflow_dispatch:

defaults:
  run:
    working-directory: companion

jobs:
  test-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: companion/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: System packages for the end-to-end tests (virtual screen, window manager, screenshots)
        run: sudo apt-get update && sudo apt-get install -y xvfb openbox wmctrl imagemagick libxtst6
      - run: npm run test:e2e
      - run: npm run dist:linux:dir
      - run: npm run test:packaged
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: relais-e2e-screenshots
          path: companion/test/.tmp/shots

  build:
    needs: test-linux
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            script: dist:linux
          - os: windows-latest
            script: dist:win
          - os: macos-latest
            script: dist:mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: companion/package-lock.json
      - run: npm ci
      - name: Build
        run: npm run ${{ matrix.script }}
        env:
          # macOS: without a certificate, do not look for one in the keychain (unsigned build).
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ secrets.CSC_LINK != '' }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
      - uses: actions/upload-artifact@v4
        with:
          name: sklubot-relais-${{ runner.os }}
          path: |
            companion/dist/*.AppImage
            companion/dist/*.deb
            companion/dist/*.tar.gz
            companion/dist/*.exe
            companion/dist/*.zip
            companion/dist/*.dmg
          if-no-files-found: ignore
