<!doctype html>
<!-- Sklubot static template "assistant-etapes" (skill « Modèles statiques »). Layout adapted from the Astryx page template
     "form-wizard" (github.com/meta/astryx, commit fa22c93d4370d9081f0ff426f034ceaf1447c8c6, © Meta Platforms, Inc., MIT);
     rewritten as one HTML file without libraries for Sklubot. Every value marked REPLACE is an example: put the real one. -->
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Assistant en plusieurs étapes</title>
<style>
:root {
  color-scheme: light dark;
  --paper: #f7f7f5; --surface: #ffffff; --surface-2: #f0f0ec; --ink: #1d1d1b; --ink-2: #4a4a46; --muted: #6b6b66;
  --rule: #deded8; --accent: #2a5bd7; --accent-ink: #ffffff; --good: #1d7a46; --bad: #b3261e; --warn: #8a5a00;
  --radius: 10px; --gap: 16px; --font: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --dur: 160ms; --ease: cubic-bezier(.2,.7,.3,1);
}
@media (prefers-color-scheme: dark) {
  :root { --paper: #141413; --surface: #1c1c1a; --surface-2: #262623; --ink: #f1f1ec; --ink-2: #c9c9c2; --muted: #a3a39b;
    --rule: #34342f; --accent: #8fb0ff; --accent-ink: #10131a; --good: #6fd19a; --bad: #ff8a80; --warn: #f2c66d; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100dvh; background: var(--paper); color: var(--ink); font: 16px/1.5 var(--font); }
a { color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button, input, select { font: inherit; color: inherit; }
.btn { min-height: 44px; padding: 0 16px; border-radius: var(--radius); border: 1px solid var(--rule); background: var(--surface); cursor: pointer; transition: background var(--dur) var(--ease); }
.btn:hover { background: var(--surface-2); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
.wrap { max-width: 1200px; margin: 0 auto; padding: 24px 16px 48px; }
.empty { padding: 32px 16px; text-align: center; color: var(--muted); border: 1px dashed var(--rule); border-radius: var(--radius); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.panel { max-width: 640px; margin: 0 auto; background: var(--surface); border: 1px solid var(--rule); border-radius: var(--radius); padding: 24px 16px; }
h1 { margin: 0 0 16px; font-size: clamp(1.4rem, 1.1rem + 1.2vw, 2rem); }
ol.steps { display: flex; gap: 8px; list-style: none; margin: 0 0 24px; padding: 0; counter-reset: s; }
ol.steps li { flex: 1; font-size: .85rem; color: var(--muted); border-top: 4px solid var(--rule); padding-top: 6px; }
ol.steps li[aria-current="step"] { color: var(--ink); border-color: var(--accent); }
ol.steps li.done { border-color: var(--good); }
fieldset { border: 0; margin: 0; padding: 0; } legend { font-weight: 600; margin-bottom: 12px; }
label { display: block; margin: 12px 0 4px; }
input, select { width: 100%; min-height: 44px; padding: 0 12px; border: 1px solid var(--rule); border-radius: var(--radius); background: var(--paper); }
.error { color: var(--bad); font-size: .9rem; min-height: 1.4em; margin: 4px 0 0; }
.nav { display: flex; justify-content: space-between; gap: 8px; margin-top: 24px; }
dl.review { display: grid; grid-template-columns: max-content 1fr; gap: 6px 16px; } dl.review dt { color: var(--muted); }
</style>
</head>
<body>
<main class="wrap">
  <form class="panel" id="wizard" novalidate>
    <h1>Demande de devis<!-- REPLACE --></h1>
    <ol class="steps" aria-label="Étapes"><li>1. Vous</li><li>2. Le projet</li><li>3. Vérifier</li></ol>
    <fieldset data-step="0">
      <legend>Vous</legend>
      <label for="name">Nom</label><input id="name" name="name" required autocomplete="name">
      <label for="email">E-mail</label><input id="email" name="email" type="email" required autocomplete="email">
    </fieldset>
    <fieldset data-step="1" hidden>
      <legend>Le projet</legend>
      <label for="kind">Type</label><select id="kind" name="kind" required><option value="">Choisir…</option><option>Site</option><option>Boutique</option></select>
      <label for="budget">Budget (€)</label><input id="budget" name="budget" type="number" min="0" inputmode="numeric">
    </fieldset>
    <fieldset data-step="2" hidden>
      <legend>Vérifier avant d'envoyer</legend>
      <dl class="review" id="review"></dl>
    </fieldset>
    <p class="error" id="error" role="alert"></p>
    <div class="nav">
      <button class="btn" type="button" id="back">Retour</button>
      <button class="btn primary" type="button" id="next">Suivant</button>
    </div>
  </form>
</main>
<script>
// The last step only shows what was typed: sending it is wired by the page's owner (a form address they chose).
const steps = [...document.querySelectorAll("[data-step]")], marks = [...document.querySelectorAll("ol.steps li")];
let at = 0;
const $ = (id) => document.getElementById(id);
function show() {
  steps.forEach((s, i) => { s.hidden = i !== at; });
  marks.forEach((m, i) => { m.classList.toggle("done", i < at); if (i === at) m.setAttribute("aria-current", "step"); else m.removeAttribute("aria-current"); });
  $("back").disabled = at === 0; $("next").textContent = at === steps.length - 1 ? "Envoyer" : "Suivant";
  if (at === steps.length - 1) {
    const f = new FormData($("wizard"));
    $("review").innerHTML = [...f.entries()].map(([k, v]) => `<dt>${k}</dt><dd>${String(v).replace(/[&<>]/g, "") || "—"}</dd>`).join("");
  }
  steps[at].querySelector("input, select")?.focus();
}
function valid() {
  const bad = [...steps[at].querySelectorAll("[required]")].find((el) => !el.checkValidity());
  $("error").textContent = bad ? `À compléter : ${bad.labels[0]?.textContent ?? bad.name}` : "";
  bad?.focus();
  return !bad;
}
$("next").addEventListener("click", () => { if (at < steps.length - 1) { if (valid()) { at++; show(); } } else { $("error").textContent = "Envoi à brancher : REPLACE"; } });
$("back").addEventListener("click", () => { if (at > 0) { at--; $("error").textContent = ""; show(); } });
show();
</script>
</body>
</html>
