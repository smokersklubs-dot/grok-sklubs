plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
}

// Release signing reads keystore.properties (not committed). Without it the release build is unsigned.
def keystoreFile = rootProject.file("keystore.properties")
def keystore = new Properties()
if (keystoreFile.exists()) keystoreFile.withInputStream { keystore.load(it) }

android {
    namespace "app.sklubot.android"
    compileSdk 35

    defaultConfig {
        applicationId "fr.sklubot.android"
        minSdk 24
        targetSdk 35
        versionCode 5
        versionName "1.3.0"
        // Address pre-filled on first run; override with -PsklubotServer=https://… (empty = no default).
        buildConfigField "String", "DEFAULT_SERVER", "\"" + (project.findProperty("sklubotServer") ?: "https://sklubot.sklubs.fr") + "\""
    }
    signingConfigs {
        release {
            if (keystoreFile.exists()) {
                storeFile rootProject.file(keystore["storeFile"])
                storePassword keystore["storePassword"]
                keyAlias keystore["keyAlias"]
                keyPassword keystore["keyPassword"]
                // v1 (JAR) + v2 + v3: widest installer compatibility (some OEM installers, e.g. Samsung, are picky).
                enableV1Signing true
                enableV2Signing true
                enableV3Signing true
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            if (keystoreFile.exists()) signingConfig signingConfigs.release
        }
    }
    buildFeatures { buildConfig true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = "17" }
    testOptions {
        unitTests.includeAndroidResources = true
        unitTests.all {
            it.testLogging { events "passed", "failed", "skipped"; exceptionFormat "full" }
            // Where the screen tests (ScreensTest, Robolectric) write their pictures.
            it.systemProperty "screens.dir", System.getProperty("screens.dir", "${buildDir}/screens")
            it.systemProperty "robolectric.dependency.repo.url", System.getProperty("robolectric.dependency.repo.url", "https://repo1.maven.org/maven2")
        }
    }
}

dependencies {
    // WebSocket client of the phone relay (outbound only). https://square.github.io/okhttp/
    implementation "com.squareup.okhttp3:okhttp:4.12.0"
    testImplementation "junit:junit:4.13.2"
    // android.jar only has stubs of org.json: the JVM unit tests use the real implementation.
    testImplementation "org.json:json:20240303"
    // Renders the relay's screens on the JVM with real Android graphics (GraphicsMode NATIVE). https://robolectric.org
    testImplementation "org.robolectric:robolectric:4.14.1"
}
