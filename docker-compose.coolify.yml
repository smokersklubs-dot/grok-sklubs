# Mise en ligne de Sklubot (Coolify, ou tout serveur avec Docker Compose).
# Coolify se charge du domaine et du HTTPS ; il suffit de pointer le domaine vers le port 3000 du service "sklubot".
services:
  sklubot:
    build:
      context: .
      dockerfile: Dockerfile.production
    restart: unless-stopped
    depends_on:
      desktop-image:
        condition: service_completed_successfully
      docker-proxy:
        condition: service_started
    environment:
      PORT: "3000"
      PUBLIC_URL: "${SKLUBOT_PUBLIC_URL}"
      SESSION_SECRET: "${SKLUBOT_SESSION_SECRET}"
      # Code à donner pour créer le premier compte. Mets une valeur au hasard avant la première mise en ligne.
      SETUP_CODE: "${SKLUBOT_SETUP_CODE:-}"
      # Derrière le proxy de Coolify : l'adresse du visiteur est la dernière entrée de X-Forwarded-For.
      TRUST_PROXY: "1"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      XAI_API_KEY: "${XAI_API_KEY:-}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      DEFAULT_MODEL: "${SKLUBOT_DEFAULT_MODEL:-}"
      DEMO_MODE: "${SKLUBOT_DEMO_MODE:-0}"
      FALLBACK_MODEL: "${SKLUBOT_FALLBACK_MODEL:-}"
      BRAVE_API_KEY: "${BRAVE_API_KEY:-}"
      SEARXNG_URL: "${SEARXNG_URL:-}"
      OPEN_SIGNUP: "${SKLUBOT_OPEN_SIGNUP:-0}"
      ALLOWED_EMAILS: "${SKLUBOT_ALLOWED_EMAILS:-}"
      # Mode hébergé commercial (offres, abonnements, budget IA par compte, page d'administration) : 1 pour l'activer.
      # Voir docs/MODE-HEBERGE.md. À 0 (par défaut), Sklubot se comporte exactement comme une installation personnelle.
      HOSTED_MODE: "${SKLUBOT_HOSTED_MODE:-0}"
      # Ouverture publique (docs/OUVERTURE-PUBLIQUE.md), tout vide = valeurs par défaut. Turnstile : clés du tableau de bord
      # Cloudflare (la clé secrète ne quitte jamais le serveur). Limites d'inscription par quart d'heure : par adresse IP, et en tout.
      TURNSTILE_SITE_KEY: "${SKLUBOT_TURNSTILE_SITE_KEY:-}"
      TURNSTILE_SECRET_KEY: "${SKLUBOT_TURNSTILE_SECRET_KEY:-}"
      SIGNUP_PER_IP: "${SKLUBOT_SIGNUP_PER_IP:-}"
      SIGNUP_GLOBAL: "${SKLUBOT_SIGNUP_GLOBAL:-}"
      DISPOSABLE_EMAIL_BLOCK: "${SKLUBOT_DISPOSABLE_EMAIL_BLOCK:-}"
      EMAIL_VERIFICATION: "${SKLUBOT_EMAIL_VERIFICATION:-}"
      # Comptes jamais confirmés : supprimés automatiquement après ce nombre d'heures (défaut 5).
      UNVERIFIED_ACCOUNT_TTL_HOURS: "${SKLUBOT_UNVERIFIED_ACCOUNT_TTL_HOURS:-}"
      # Offre Gratuite (mode hébergé) : ordinateurs jetables partagés (pool), « personal » (comme avant) ; combien à la fois.
      FREE_PLAN_COMPUTER: "${SKLUBOT_FREE_PLAN_COMPUTER:-}"
      FREE_COMPUTERS_MAX: "${SKLUBOT_FREE_COMPUTERS_MAX:-}"
      FREE_COMPUTER_IDLE_MIN: "${SKLUBOT_FREE_COMPUTER_IDLE_MIN:-}"
      FREE_COMPUTER_MEMORY: "${SKLUBOT_FREE_COMPUTER_MEMORY:-}"
      FREE_COMPUTER_CPUS: "${SKLUBOT_FREE_COMPUTER_CPUS:-}"
      # « Continuer avec Google » : identifiants OAuth (console Google Cloud), ou à saisir dans Réglages → Compte.
      GOOGLE_LOGIN_CLIENT_ID: "${SKLUBOT_GOOGLE_LOGIN_CLIENT_ID:-}"
      GOOGLE_LOGIN_CLIENT_SECRET: "${SKLUBOT_GOOGLE_LOGIN_CLIENT_SECRET:-}"
      COMPUTER: "linux"
      DATA_VOLUME: "sklubot_data"
      # Les ordinateurs des bots sont sur leur propre réseau (BOTS_NETWORK, créé par Sklubot, sans trafic entre eux) et
      # joignent Sklubot par une prise (socket) qui leur est propre, servie à part : ils n'atteignent ni ses ports, ni le
      # récepteur de courrier, ni le proxy Docker, ni la voix, ni les autres ordinateurs (revue de sécurité H2).
      BOT_LINK: "${SKLUBOT_BOT_LINK:-socket}"
      BOTS_NETWORK: "sklubot_bots"
      # Utilisés seulement avec SKLUBOT_BOT_LINK=network (l'ancienne façon, sur le réseau de Sklubot).
      DESKTOP_NETWORK: "sklubot_net"
      ENGINE_BASE_URL: "http://sklubot:3000"
      MAX_DESKTOPS: "${SKLUBOT_MAX_DESKTOPS:-4}"
      # Durée max d'un tour Claude Code / Codex, en minutes (0 = sans limite).
      ENGINE_TURN_TIMEOUT_MINUTES: "${SKLUBOT_ENGINE_TURN_TIMEOUT_MINUTES:-60}"
      DESKTOP_MEMORY: "${SKLUBOT_DESKTOP_MEMORY:-2g}"
      # Facultatif : taille maximale du disque propre de chaque ordinateur (ex. 20G), seulement là où Docker sait la
      # limiter (overlay2 sur xfs avec pquota, btrfs, zfs) ; ailleurs, ignoré. Vide = pas de limite.
      DESKTOP_DISK_QUOTA: "${SKLUBOT_DESKTOP_DISK_QUOTA:-}"
      # Facultatif : environnement d'exécution des ordinateurs (ex. runsc pour gVisor, à installer sur l'hôte).
      DESKTOP_RUNTIME: "${SKLUBOT_DESKTOP_RUNTIME:-}"
      # Sous cet espace libre (Mo) sur le disque des données, l'ordinateur inactif qui a le plus écrit est mis en veille.
      DISK_FREE_MIN_MB: "${SKLUBOT_DISK_FREE_MIN_MB:-2048}"
      # Ordinateurs partagés entre les bots d'un compte : au plus ce nombre par compte.
      MAX_SHARED_COMPUTERS: "${SKLUBOT_MAX_SHARED_COMPUTERS:-3}"
      DESKTOP_CPUS: "${SKLUBOT_DESKTOP_CPUS:-2}"
      # Clavier des ordinateurs des bots (nom de disposition X : us, fr, de…).
      DESKTOP_KEYBOARD: "${SKLUBOT_DESKTOP_KEYBOARD:-us}"
      # Docker à travers le proxy filtrant ci-dessous, jamais le socket lui-même.
      DOCKER_HOST: "tcp://docker-proxy:2375"
      # Voix serveur : par défaut whisper.cpp + Piper ci-dessous (réseau interne « voice »). Une autre adresse les remplace ;
      # SKLUBOT_VOICE_LOCAL=0 les coupe (la dictée et les appels passent alors par le navigateur, ou Réglages → Voix).
      VOICE_STT_URL: "${SKLUBOT_VOICE_STT_URL:-http://whisper:8080}"
      VOICE_TTS_URL: "${SKLUBOT_VOICE_TTS_URL:-http://piper:5000}"
      VOICE_LOCAL: "${SKLUBOT_VOICE_LOCAL:-1}"
      # Kokoro (ci-dessous, actif par défaut) : voix gratuites de meilleure qualité, données automatiquement aux bots avec
      # celles de Piper. SKLUBOT_KOKORO=0 le met en veille (Piper seul) ; une autre adresse le remplace.
      VOICE_KOKORO_URL: "${SKLUBOT_VOICE_KOKORO_URL:-http://kokoro:8880}"
      VOICE_KOKORO: "${SKLUBOT_KOKORO:-1}"
      # Vague 6 — adresse e-mail propre aux bots : domaine dont le MX pointe vers ce serveur. Le récepteur écoute sur 2525
      # dans le conteneur (pas de privilège pour le port 25) ; publier le port 25 : docker-compose.mail.yml.
      MAIL_DOMAIN: "${SKLUBOT_MAIL_DOMAIN:-}"
      MAIL_SMTP_PORT: "${SKLUBOT_MAIL_SMTP_PORT:-0}"
      MAIL_HOSTNAME: "${SKLUBOT_MAIL_HOSTNAME:-}"
      # E-mails du serveur (mot de passe oublié, changement d'adresse). Facultatif : sinon, réglables dans
      # Réglages → Compte par le propriétaire. Ces variables l'emportent. SMTP_TLS : tls (port 465), starttls (587) ou none.
      SMTP_HOST: "${SKLUBOT_SMTP_HOST:-}"
      SMTP_PORT: "${SKLUBOT_SMTP_PORT:-}"
      SMTP_TLS: "${SKLUBOT_SMTP_TLS:-}"
      SMTP_USER: "${SKLUBOT_SMTP_USER:-}"
      SMTP_PASS: "${SKLUBOT_SMTP_PASS:-}"
      SMTP_FROM: "${SKLUBOT_SMTP_FROM:-}"
      # Places des espaces d'équipe (par défaut, et maximum qu'un propriétaire peut choisir).
      WORKSPACE_SEATS: "${SKLUBOT_WORKSPACE_SEATS:-10}"
      WORKSPACE_MAX_SEATS: "${SKLUBOT_WORKSPACE_MAX_SEATS:-50}"
    volumes:
      - sklubot_data:/data
    # Aucun privilège Linux, système de fichiers en lecture seule (seules /data et /tmp s'écrivent).
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - "no-new-privileges:true"
    networks:
      - default
      - docker
      - voice
    expose:
      - "3000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:3000/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # Le seul à voir le socket Docker : le proxy de Sklubot (server/src/dockerproxy.ts, même image que l'application,
  # lancé seul, sans données ni secret ni privilège). Il lit le contenu des demandes, pas seulement leurs adresses :
  # un conteneur n'est créé que depuis l'image des ordinateurs, sans privilège, avec les capacités réduites, sur le
  # réseau des bots, sans dossier de l'hôte ni espace de noms de l'hôte ; les autres actions ne touchent que les
  # conteneurs portant l'étiquette de Sklubot ; tout le reste répond 403 (revue de sécurité H3). Cela reste un accès
  # à Docker : il ne doit jamais être joignable par autre chose que l'application (réseau interne « docker »).
  # Sur un système à SELinux (Fedora, RHEL), ajoute « security_opt: [label:disable] » à ce service si Sklubot ne joint pas Docker.
  docker-proxy:
    build:
      context: .
      dockerfile: Dockerfile.production
    command: ["node", "server/dist/dockerproxy.js"]
    restart: unless-stopped
    environment:
      DESKTOP_IMAGE: "sklubot-desktop"
      # Réseaux où un ordinateur peut être créé. Avec SKLUBOT_BOT_LINK=network (l'ancienne façon), mets
      # SKLUBOT_PROXY_NETWORKS=sklubot_bots,sklubot_net.
      PROXY_NETWORKS: "${SKLUBOT_PROXY_NETWORKS:-sklubot_bots}"
      PROXY_DATA_VOLUME: "sklubot_data"
      PROXY_RUNTIMES: "${SKLUBOT_DESKTOP_RUNTIME:-}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - "no-new-privileges:true"
    networks:
      - docker

  desktop-image:
    build:
      context: docker/desktop
    image: sklubot-desktop
    command: ["true"]
    restart: "no"


  # ── Voix serveur auto-hébergée, gratuite : ACTIVE PAR DÉFAUT (dictée et appels sur tous les navigateurs) ──
  # whisper.cpp (voix → texte) et Piper (texte → voix) tournent sans profil : la dictée et les appels marchent aussi là où le
  # navigateur n'a pas de reconnaissance vocale (iOS Safari, Firefox, Brave, beaucoup de WebViews Android).
  # Réseau : seulement « voice » (interne, sans Internet, jamais publié), que seule l'application rejoint — ni les
  # ordinateurs des bots (réseau sklubot_bots), ni Internet ne les atteignent. Aucun port publié : dans Coolify, ne leur
  # donne pas de domaine.
  # Mémoire (estimations, en marche) : whisper « small » (défaut) ≈ 0,9 à 1,2 Go, « base » ≈ 300 à 500 Mo (WHISPER_MODEL=base, WHISPER_MEM_LIMIT=1g),
  # Piper ≈ 210 Mo avec une voix, + 150 à 190 Mo par modèle de voix utilisé (les quatre : ≈ 0,7 à 0,9 Go, mesuré).
  # Plafonnées par WHISPER_MEM_LIMIT / PIPER_MEM_LIMIT. Priorité CPU plus basse que
  # l'application (cpu_shares).
  # Désactiver : SKLUBOT_VOICE_LOCAL=0 (et redéployer) — les deux services restent en veille (quelques Mo) et Sklubot ne
  # les utilise plus ; le navigateur, ou un service choisi dans Réglages → Voix, prend le relais.
  #
  # Le modèle whisper est téléchargé une fois (Hugging Face, ggerganov/whisper.cpp, poids Whisper sous licence MIT) dans le
  # volume whisper_models par « whisper-model », seul à avoir Internet, qui s'arrête aussitôt ; whisper lui-même n'a que
  # le réseau interne et lit le volume en lecture seule. WHISPER_MODEL : small (défaut, multilingue, 466 Mo, bien meilleur en français) ou base (142 Mo, petites machines)
  # (multilingue, 466 Mo, comprend mieux le français, plus lent). Point d'entrée de l'image : bash -c, d'où une seule
  # chaîne de commande ($$ = « $ » pour le shell du conteneur).
  whisper-model:
    image: "${WHISPER_IMAGE:-ghcr.io/ggml-org/whisper.cpp:main@sha256:203ed2a39087406689e78ea5a664fef7ae596ee548f3323a4ffc63169da84933}"
    restart: "no"
    environment:
      VOICE_LOCAL: "${SKLUBOT_VOICE_LOCAL:-1}"
      WHISPER_MODEL: "${WHISPER_MODEL:-small}"
    command: ["if [ \"$$VOICE_LOCAL\" = 0 ]; then echo 'SKLUBOT_VOICE_LOCAL=0 : voix locale désactivée.'; exit 0; fi; f=/models/ggml-$$WHISPER_MODEL.bin; if [ -s \"$$f\" ]; then echo \"Modèle déjà présent : $$f\"; exit 0; fi; ./models/download-ggml-model.sh \"$$WHISPER_MODEL\" /models || { rm -f \"$$f\"; echo 'Téléchargement du modèle impossible : la dictée passera par le navigateur. Redéploie pour réessayer.'; }; exit 0"]
    volumes:
      - whisper_models:/models
    mem_limit: 256m
    pids_limit: 64
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks:
      - default
  whisper:
    image: "${WHISPER_IMAGE:-ghcr.io/ggml-org/whisper.cpp:main@sha256:203ed2a39087406689e78ea5a664fef7ae596ee548f3323a4ffc63169da84933}"
    restart: unless-stopped
    depends_on:
      whisper-model:
        condition: service_completed_successfully
    environment:
      VOICE_LOCAL: "${SKLUBOT_VOICE_LOCAL:-1}"
      WHISPER_MODEL: "${WHISPER_MODEL:-small}"
      WHISPER_THREADS: "${WHISPER_THREADS:-4}"
    # Sans modèle (téléchargement raté), il attend 5 min puis redémarre : Sklubot le voit injoignable et passe par le navigateur.
    command: ["if [ \"$$VOICE_LOCAL\" = 0 ]; then echo 'SKLUBOT_VOICE_LOCAL=0 : en veille.'; exec sleep infinity; fi; f=/models/ggml-$$WHISPER_MODEL.bin; if [ ! -s \"$$f\" ]; then echo \"Modèle absent ($$f) : redéploie pour le télécharger.\"; sleep 300; exit 1; fi; exec whisper-server --host 0.0.0.0 --port 8080 -t \"$$WHISPER_THREADS\" -m \"$$f\" -l auto"]
    volumes:
      - whisper_models:/models:ro
    read_only: true
    tmpfs: [/tmp]
    mem_limit: "${WHISPER_MEM_LIMIT:-2g}"
    cpu_shares: 512
    pids_limit: 128
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks:
      - voice
  # Piper : pas d'image officielle du serveur HTTP ; construite ici (docker/piper : piper-tts épinglé ; moteur Piper sous
  # GPL-3.0, service à part). Voix gratuites incluses (licences vérifiées, usage commercial permis, docs/VOIX.md) : françaises
  # fr_FR-siwis-medium (CC BY 4.0, voix par défaut), fr_FR-upmc-medium (CC BY-SA 4.0), fr_FR-mls-medium (CC BY 4.0, 125
  # lecteurs) et anglaise en_GB-vctk-medium (CC BY 4.0) : chaque bot reçoit automatiquement sa propre voix parmi elles.
  # Un modèle n'est chargé en mémoire que quand un bot l'utilise ; moins de voix : --build-arg PIPER_VOICES="…".
  piper:
    build:
      context: docker/piper
    image: sklubot-piper
    restart: unless-stopped
    environment:
      VOICE_LOCAL: "${SKLUBOT_VOICE_LOCAL:-1}"
    read_only: true
    tmpfs: [/tmp]
    mem_limit: "${PIPER_MEM_LIMIT:-1200m}"
    cpu_shares: 512
    pids_limit: 128
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks:
      - voice

  # ── Kokoro : synthèse vocale gratuite auto-hébergée, ACTIVE PAR DÉFAUT (meilleure qualité que Piper) ──
  # Kokoro-FastAPI (https://github.com/remsky/Kokoro-FastAPI, Apache-2.0), modèle Kokoro-82M (Apache-2.0,
  # https://huggingface.co/hexgrad/Kokoro-82M), image CPU officielle épinglée, modèle et voix inclus dans l'image
  # (DOWNLOAD_MODEL=false : rien n'est téléchargé au démarrage ; HF_HUB_OFFLINE=1). Ses voix rejoignent les voix
  # automatiques des bots (anglais : af_/am_/bf_/bm_ ; français : ff_siwis, mêlée aux voix françaises de Piper).
  # S'il ne répond pas (démarrage, veille), les bots parlent avec Piper : rien ne casse.
  # Mémoire : ≈ 1 à 1,5 Go en marche (82 M paramètres + PyTorch CPU), plafonnée par KOKORO_MEM_LIMIT (2 Go par défaut).
  # Toute la voix (whisper small + Piper + Kokoro) : ≈ 2 à 3,5 Go. Veille : SKLUBOT_KOKORO=0 (Kokoro seul) ou
  # SKLUBOT_VOICE_LOCAL=0 (toute la voix locale), puis redéploie.
  # Système de fichiers en lecture seule ; seuls /tmp (mélanges de voix), api/temp_files (fichiers du lecteur web de
  # l'image) et le dossier personnel sont en mémoire. Réseau : seulement « voice » (interne, sans Internet), que seule
  # l'application rejoint — ni publié, ni joignable par les ordinateurs des bots.
  kokoro:
    image: "${KOKORO_IMAGE:-ghcr.io/remsky/kokoro-fastapi-cpu:v0.10.0}"
    restart: unless-stopped
    environment:
      VOICE_LOCAL: "${SKLUBOT_VOICE_LOCAL:-1}"
      KOKORO: "${SKLUBOT_KOKORO:-1}"
      DOWNLOAD_MODEL: "false"
      HF_HUB_OFFLINE: "1"
    # Point d'entrée de l'image : CMD ./entrypoint.sh (docker/cpu/Dockerfile.optimized au tag v0.10.0) ; en veille, il
    # dort au lieu de charger le modèle ($$ = « $ » pour le shell du conteneur).
    command: ["sh", "-c", "if [ \"$$VOICE_LOCAL\" = 0 ] || [ \"$$KOKORO\" = 0 ]; then echo 'Kokoro en veille.'; exec sleep infinity; fi; exec ./entrypoint.sh"]
    read_only: true
    tmpfs:
      - /tmp
      - /app/api/temp_files:uid=1000,gid=1000
      - /home/appuser:uid=1000,gid=1000
    mem_limit: "${KOKORO_MEM_LIMIT:-2g}"
    cpu_shares: 512
    pids_limit: 256
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks:
      - voice

networks:
  default:
    name: sklubot_net
  # Interne : l'application et le proxy Docker seulement (pas les ordinateurs des bots, pas Internet).
  docker:
    name: sklubot_docker
    internal: true
  # Interne : l'application et ses services de voix (whisper, Piper, Kokoro) seulement — pas les ordinateurs des bots,
  # pas Internet.
  voice:
    name: sklubot_voice
    internal: true

volumes:
  sklubot_data:
    name: sklubot_data
  whisper_models:
