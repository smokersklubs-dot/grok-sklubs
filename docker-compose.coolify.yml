# Mise en ligne de Sklubot (Coolify, ou tout serveur avec Docker Compose).
# Coolify se charge du domaine et du HTTPS ; il suffit de pointer le domaine vers le port 3000 du service "sklubot".
services:
  sklubot:
    build:
      context: .
      dockerfile: Dockerfile.production
    restart: unless-stopped
    depends_on:
      desktop-image:
        condition: service_completed_successfully
      docker-proxy:
        condition: service_started
    environment:
      PORT: "3000"
      PUBLIC_URL: "${SKLUBOT_PUBLIC_URL}"
      SESSION_SECRET: "${SKLUBOT_SESSION_SECRET}"
      # Code à donner pour créer le premier compte. Mets une valeur au hasard avant la première mise en ligne.
      SETUP_CODE: "${SKLUBOT_SETUP_CODE:-}"
      # Derrière le proxy de Coolify : l'adresse du visiteur est la dernière entrée de X-Forwarded-For.
      TRUST_PROXY: "1"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      XAI_API_KEY: "${XAI_API_KEY:-}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      DEFAULT_MODEL: "${SKLUBOT_DEFAULT_MODEL:-}"
      DEMO_MODE: "${SKLUBOT_DEMO_MODE:-0}"
      FALLBACK_MODEL: "${SKLUBOT_FALLBACK_MODEL:-}"
      BRAVE_API_KEY: "${BRAVE_API_KEY:-}"
      SEARXNG_URL: "${SEARXNG_URL:-}"
      OPEN_SIGNUP: "${SKLUBOT_OPEN_SIGNUP:-0}"
      ALLOWED_EMAILS: "${SKLUBOT_ALLOWED_EMAILS:-}"
      COMPUTER: "linux"
      DATA_VOLUME: "sklubot_data"
      # The bots' computers join this network so their subscription tools can reach Sklubot's tool endpoint.
      DESKTOP_NETWORK: "sklubot_net"
      ENGINE_BASE_URL: "http://sklubot:3000"
      MAX_DESKTOPS: "${SKLUBOT_MAX_DESKTOPS:-4}"
      DESKTOP_MEMORY: "${SKLUBOT_DESKTOP_MEMORY:-2g}"
      # Docker à travers le proxy filtrant ci-dessous, jamais le socket lui-même.
      DOCKER_HOST: "tcp://docker-proxy:2375"
    volumes:
      - sklubot_data:/data
    # Aucun privilège Linux, système de fichiers en lecture seule (seules /data et /tmp s'écrivent).
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - "no-new-privileges:true"
    networks:
      - default
      - docker
    expose:
      - "3000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:3000/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # Donne à Sklubot le droit de créer les ordinateurs des bots sur ce serveur, et seulement cela : conteneurs, exec,
  # volumes, images, réseaux (README officiel : github.com/Tecnativa/docker-socket-proxy). Cela reste un accès
  # puissant au Docker de la machine : ne partage ce serveur qu'avec des gens de confiance.
  docker-proxy:
    image: "${DOCKER_PROXY_IMAGE:-tecnativa/docker-socket-proxy:v0.5.0}"
    restart: unless-stopped
    environment:
      CONTAINERS: "1"
      EXEC: "1"
      IMAGES: "1"
      VOLUMES: "1"
      NETWORKS: "1"
      POST: "1"
      ALLOW_START: "1"
      ALLOW_STOP: "1"
      DISABLE_IPV6: "1"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - docker

  # Construit l'image de l'ordinateur Linux des bots sur ce serveur, puis s'arrête.
  desktop-image:
    build:
      context: docker/desktop
    image: sklubot-desktop
    command: ["true"]
    restart: "no"

networks:
  default:
    name: sklubot_net
  # Interne : l'application et le proxy Docker seulement (pas les ordinateurs des bots, pas Internet).
  docker:
    name: sklubot_docker
    internal: true

volumes:
  sklubot_data:
    name: sklubot_data
