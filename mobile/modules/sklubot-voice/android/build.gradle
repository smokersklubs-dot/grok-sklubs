plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'app.sklubot'
version = '1.1.0'

android {
  namespace "app.sklubot.voice"
  defaultConfig {
    versionCode 2
    versionName '1.1.0'
  }
  testOptions {
    unitTests.all {
      it.testLogging { events "passed", "failed", "skipped"; exceptionFormat "full" }
    }
  }
}

dependencies {
  testImplementation "junit:junit:4.13.2"
}
