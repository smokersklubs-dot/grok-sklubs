plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'app.sklubot'
version = '1.1.0'

android {
  namespace "app.sklubot.live"
  defaultConfig {
    versionCode 2
    versionName '1.1.0'
  }
  testOptions {
    unitTests.all {
      it.testLogging { events "passed", "failed", "skipped"; exceptionFormat "full" }
    }
  }
}

dependencies {
  // The live channel is a long HTTP response read line by line. https://square.github.io/okhttp/ — React Native ships OkHttp 4.
  implementation "com.squareup.okhttp3:okhttp:4.12.0"
  testImplementation "junit:junit:4.13.2"
  // android.jar only has stubs of org.json: the JVM unit tests use the real implementation.
  testImplementation "org.json:json:20240303"
}
