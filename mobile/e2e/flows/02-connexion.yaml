# Étape 2 : adresse du serveur de test (l'ordinateur qui fait tourner l'émulateur = 10.0.2.2), puis connexion
# avec le compte créé par le workflow. Jusqu'à l'écran des bots.
appId: ${APP_ID}
---
# Un dialogue système de l'émulateur (« … isn't responding ») peut recouvrir l'appli : on le laisse attendre.
- tapOn:
    text: "Wait"
    optional: true
- tapOn:
    id: "server-url"
# Le champ contient déjà l'adresse par défaut et le toucher place le curseur au milieu : flèche bas = fin du texte
# (Selection.moveDown sur la dernière ligne), puis on efface tout.
- pressKey: Remote Dpad Down
- eraseText: 80
- inputText: ${SERVER_URL}
- assertVisible: ${SERVER_URL}
- takeScreenshot: 03-adresse-saisie
- hideKeyboard
- tapOn: "Continuer"
- extendedWaitUntil:
    visible:
      id: "signin-email"
    timeout: 30000
- takeScreenshot: 04-ecran-connexion
- tapOn:
    id: "signin-email"
- inputText: ${E2E_EMAIL}
- tapOn:
    id: "signin-password"
- inputText: ${E2E_PASSWORD}
- takeScreenshot: 05-identifiants-saisis
# Le clavier « OK/Go » envoie le formulaire (onSubmitEditing), comme le bouton Se connecter.
- pressKey: enter
- extendedWaitUntil:
    visible: "Juno"
    timeout: 60000
- assertNotVisible:
    id: "signin-password"
- takeScreenshot: 06-liste-des-bots
