# Real test of the Android app on a virtual phone, at every change of the app (or of the server it signs in to):
# build the APK (variant "complet", the one installed from a file), check it (package, min SDK, signature,
# x86_64 code), install it on an Android emulator, open it, sign in to a Sklubot server started on this runner,
# talk to a bot, put it in the background / rotate / restart it, and look for crashes in logcat.
# A screenshot at every step; screenshots, logcat and the tested APK are uploaded as artifacts.
#
# The tested APK is signed with the debug key (mobile/plugins/withReleaseSigning.js falls back to it when
# mobile/keystore.properties is absent — the real key never reaches CI). It is for checking, not for distribution.
name: android

on:
  push:
    branches: [main, 'claude/**']
    paths: ['mobile/**', 'server/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['mobile/**', 'server/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_ID: fr.sklubot.app.complet
  # Android emulator → the computer running it is 10.0.2.2 (https://developer.android.com/studio/run/emulator-networking).
  # Plain http is accepted for this address only (mobile/src/api/origin.ts and mobile/plugins/withDevCleartext.js).
  SERVER_PORT: '8799'
  SERVER_URL: http://10.0.2.2:8799
  E2E_EMAIL: testeur-ci@example.com
  # https://github.com/mobile-dev-inc/maestro/releases (install script: https://get.maestro.mobile.dev reads MAESTRO_VERSION)
  MAESTRO_VERSION: '2.12.1'

jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            mobile/package-lock.json

      # Expo SDK 58 / React Native build: Java 17+ (mobile/README.md).
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # https://github.com/gradle/actions/blob/main/docs/setup-gradle.md (caches Gradle dependencies between runs)
      - uses: gradle/actions/setup-gradle@v5

      # ---------- 1. Build ----------
      - name: Mobile dependencies
        working-directory: mobile
        run: npm ci

      - id: build
        name: Build the APK (variant complet, native project generated by Expo)
        working-directory: mobile
        run: |
          test ! -f keystore.properties   # never in CI: the build falls back to the debug key
          npx expo prebuild -p android --clean --no-install
          cd android
          ./gradlew :app:assembleRelease --no-daemon --stacktrace
          mkdir -p ../e2e-out
          cp app/build/outputs/apk/release/app-release.apk ../e2e-out/sklubot-complet-test.apk
          ls -la ../e2e-out

      - id: apkcheck
        name: Check the APK (package, min SDK, x86_64 code, signature)
        working-directory: mobile/e2e-out
        run: |
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)"
          echo "build-tools : $BT"
          "$BT/aapt2" dump badging sklubot-complet-test.apk > badging.txt
          head -n 5 badging.txt; grep -E "^(sdkVersion|targetSdkVersion|native-code|launchable-activity)" badging.txt
          grep -q "^package: name='$APP_ID'" badging.txt || { echo "::error::Nom de paquet inattendu"; exit 1; }
          grep -q "^sdkVersion:'24'" badging.txt || { echo "::error::minSdk attendu : 24"; exit 1; }
          grep -q "^launchable-activity:" badging.txt || { echo "::error::Aucune activité de lancement : l'appli n'aurait pas d'icône"; exit 1; }
          grep "^native-code:" badging.txt | grep -q "'x86_64'" || { echo "::error::Pas de code x86_64 : l'émulateur ne pourrait pas l'installer"; exit 1; }
          grep "^native-code:" badging.txt | grep -q "'arm64-v8a'" || { echo "::error::Pas de code arm64-v8a : les téléphones (Samsung…) ne pourraient pas l'installer"; exit 1; }
          "$BT/apksigner" verify --verbose --print-certs sklubot-complet-test.apk | tee apksigner.txt
          grep -q "Verified using v2 scheme (APK Signature Scheme v2): true" apksigner.txt || { echo "::error::Signature v2 absente"; exit 1; }

      # ---------- 2. A Sklubot server on this runner, with one account ----------
      - name: Server dependencies and build
        run: |
          npm ci
          npm run build -w server

      - id: server
        name: Start a test server (demo mode, no AI model) and create the account
        run: |
          DATA="$RUNNER_TEMP/sklubot-data"; mkdir -p "$DATA"
          SESSION_SECRET="$(openssl rand -hex 32)" DATA_DIR="$DATA" PORT="$SERVER_PORT" DEMO_MODE=1 NO_SCHEDULER=1 \
            nohup node server/dist/index.js > "$RUNNER_TEMP/server.log" 2>&1 &
          for i in $(seq 1 60); do curl -sf "http://127.0.0.1:$SERVER_PORT/api/me" > /dev/null && break; sleep 1; done
          curl -sf "http://127.0.0.1:$SERVER_PORT/api/me"; echo
          PASSWORD="ci-$(openssl rand -hex 12)"
          echo "::add-mask::$PASSWORD"
          echo "E2E_PASSWORD=$PASSWORD" >> "$GITHUB_ENV"
          # The first account of a fresh server (no SETUP_CODE set here): POST /api/auth/signup, server/src/routes.ts.
          curl -sf -H 'content-type: application/json' \
            -d "{\"email\":\"$E2E_EMAIL\",\"password\":\"$PASSWORD\",\"name\":\"Testeur CI\",\"locale\":\"fr\"}" \
            "http://127.0.0.1:$SERVER_PORT/api/auth/signup"; echo

      # ---------- 3. Virtual phone ----------
      - name: Install Maestro (drives the app's screens)
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      # https://github.com/ReactiveCircus/android-emulator-runner#running-hardware-accelerated-emulators-on-linux-runners
      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Android 14 (API 34), Google APIs image, x86_64. Inputs: https://github.com/ReactiveCircus/android-emulator-runner#configurations
      # `script` runs line by line, so the test itself is mobile/e2e/run-on-emulator.sh.
      - id: e2e
        name: Install, open, sign in, chat, restart — on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          disk-size: 6000M
          disable-animations: true
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot
          working-directory: mobile
          script: bash e2e/run-on-emulator.sh e2e-out/sklubot-complet-test.apk e2e-out

      # ---------- 4. Report ----------
      - name: Résumé en français
        if: always()
        run: |
          mark() { case "$1" in success) echo "✅";; skipped|"") echo "⏭️";; *) echo "❌";; esac; }
          {
            echo "## Test de l'appli Android sur un téléphone virtuel (Android 14)"
            echo
            echo "| | Étape |"
            echo "|---|---|"
            echo "| $(mark '${{ steps.build.outcome }}') | Construction de l'APK (variante complet) |"
            echo "| $(mark '${{ steps.apkcheck.outcome }}') | Vérification de l'APK : nom, Android 7+ (minSdk 24), code arm64 et x86_64, signature |"
            echo "| $(mark '${{ steps.server.outcome }}') | Serveur Sklubot de test démarré, compte créé |"
            if [ -s mobile/e2e-out/steps.txt ]; then
              while IFS='|' read -r s label; do echo "| $s | $label |"; done < mobile/e2e-out/steps.txt
            else
              echo "| $(mark '${{ steps.e2e.outcome }}') | Test sur le téléphone virtuel |"
            fi
            echo
            echo "Captures d'écran, journal logcat et APK testé : artefacts **android-test-captures** et **android-test-apk** en bas de cette page."
            echo "L'APK testé est signé avec la clé de débogage (pas la vraie clé) : il sert à vérifier, pas à distribuer."
          } >> "$GITHUB_STEP_SUMMARY"
          ls mobile/e2e-out/screenshots 2>/dev/null || true

      - name: Server log
        if: always()
        run: |
          cp "$RUNNER_TEMP/server.log" mobile/e2e-out/server.log 2>/dev/null || true
          tail -n 60 mobile/e2e-out/server.log 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-test-captures
          path: |
            mobile/e2e-out/screenshots/
            mobile/e2e-out/maestro/
            mobile/e2e-out/logcat*.txt
            mobile/e2e-out/steps.txt
            mobile/e2e-out/badging.txt
            mobile/e2e-out/apksigner.txt
            mobile/e2e-out/adb-install.txt
            mobile/e2e-out/am-start.txt
            mobile/e2e-out/server.log
          if-no-files-found: warn
          retention-days: 30

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-test-apk
          path: mobile/e2e-out/sklubot-complet-test.apk
          if-no-files-found: ignore
          retention-days: 14
