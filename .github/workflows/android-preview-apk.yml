name: android-preview-apk

on:
  push:
    branches: [feature/android-premium-ui]
    paths:
      - "mobile/**"
      - ".github/workflows/android-preview-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-complete-apk:
    name: Build complete Android APK
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: mobile
    env:
      SKLUBOT_VARIANT: complet
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Android SDK
        uses: android-actions/setup-android@v3
      - name: Install dependencies
        run: npm ci
      - name: Mobile typecheck and tests
        run: npm run qa
      - name: Generate Android project
        run: npx expo prebuild --platform android --clean
      - name: Build installable debug APK
        working-directory: mobile/android
        run: ./gradlew :app:assembleDebug --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sklubot-complet-android-v1.2.0
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
