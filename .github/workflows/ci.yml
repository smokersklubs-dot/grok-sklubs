# Checks every push and pull request: types, the server's tests (with the bots' Linux computer image, so the
# container tests run too), the web build, and the mobile app's tests. A red run must block merging into main
# (Settings → Branches → branch protection on main → "Require status checks": ci / server, ci / mobile).
name: ci

on:
  push:
    branches: [main, 'claude/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Types
        run: npm run typecheck
      # docs/DESIGN.md: text contrast of the tokens (light and dark), 44 px touch targets, file-size ratchet.
      - name: Design checks
        run: |
          npm run check:contrast -w web
          npm run test -w web
          npm run check:size
      - name: Web build
        run: npm run build -w web
      - name: No dev gallery in the production build
        run: npm run check:bundle -w web
      # The "browser" computer kind (screen, vault and card tools) needs a browser engine; Sklubot loads Playwright
      # if it is installed (server/src/computer.ts loadEngine), it is not a dependency. Same version as the dev setup.
      - name: Browser engine for the tests
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      # The bots' computer image: the Linux, desk, jobs and office tests use it (they skip without it).
      - name: Bots' computer image
        run: npm run computer:build
      - name: Backup and restore prerequisites
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y age
          docker build -t sklubot-server -f Dockerfile.production .
          docker run --rm --network none --entrypoint test sklubot-server -f /app/server/dist/backupcheck.js
          age --version
      - name: Server tests
        run: npm run test -w server

  mobile:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - name: Types and tests
        run: npm run qa
